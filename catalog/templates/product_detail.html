{% extends 'includes/base.html'%}
{% load my_tags %}
{% block content %}
  <div class="album py-5 bg-body-tertiary">
    <div class="container">
      <div class="row row-cols-1 row-cols-sm-2 row-cols-md-3 g-3">
        <div class="col">
          <div class="card shadow-sm">
            <img src="{{ product.image | media_filter}}">
            <div class="card-body">
              <p class="card-text">Название продукта: {{ product.product_name }}</p>
              <p class="card-text">Описание продукта: {{ product.description}} </p>
              <p class="card-text">Категория продукта: {{ product.category}} </p>
              <p class="card-text">Цена продукта: {{ product.price}} </p>
              <div class="d-flex justify-content-between align-items-center">
                <div class="btn-group">
                  <a class="btn btn-primary" href="{% url 'catalog:products' %}" role="button">Вернуться</a>
                  <a class="btn btn-primary" href="{% url 'catalog:product_update' product.pk %}" role="button">Изменить</a>
                  <a class="btn btn-primary" href="{% url 'catalog:product_delete' product.pk %}" role="button">Удалить</a>
                </div>
              </div>
            </div>
          </div>
        </div>
      </div>
    </div>
  </div>
{% endblock %}
