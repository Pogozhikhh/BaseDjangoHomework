<div class="d-flex flex-column flex-md-row align-items-center p-3 px-md-4 mb-3 bg-white border-bottom box-shadow"
     xmlns="http://www.w3.org/1999/html">
    <h5 class="my-0 mr-md-auto font-weight-normal">Skystore</h5>
    <nav class="ms-5">
        <a class="p-2 btn btn-outline-primary" href="/catalog/products/">Каталог</a>
        <a class="p-2 btn btn-outline-primary" href="/catalog/contacts/">Контакты</a>
        {% if user.is_authenticated %}
        <a class="p-2 btn btn-outline-primary" href="{% url 'catalog:add_product' %}">Добавить</a>
        <form method="POST" action="{% url 'user:logout' %}">
            {% csrf_token %}
            <button class="p-2 btn btn-outline-primary" class="text-white">Выход</button>
        </form>>
        {% else %}
        <a class="p-2 btn btn-outline-primary" href="{% url 'user:login' %}" >Войти</a>
        <a class="p-2 btn btn-outline-primary" href="{% url 'user:registration' %}">Регистрация</a>
        {% endif %}
        {% if user.is_authenticated %}
        <strong> Здравствуйте {{ user.email }}</strong>
        {% else %}
        <strong>Вы не зашли под учетной записью</strong>
        {% endif %}
    </nav>
</div>
